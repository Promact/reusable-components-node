name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships with npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Authenticates via npm trusted publishing (no token). Each package must have
      # this repo + publish.yml configured as its Trusted Publisher on npmjs.com.
      - name: Publish new versions
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published, skipping"
            else
              npm publish --workspace "$dir" --access public
            fi
          done
